/* ---- Import CSV : lit le fichier puis ouvre le modal d'options ---- */
function importCsv(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const raw=reader.result;
      const preview=parseCsvPreview(raw);
      if(!preview.rows.length){ toast('CSV vide ou illisible'); return; }
      openCsvOptionsModal(raw,preview);
    }catch(e){ alert('CSV illisible: '+e.message); }
  };
  reader.readAsText(file);
}
/* Détecte séparateur et renvoie {sep,rows} (rows = tableau de cellules) */
function parseCsvPreview(raw){
  // Auto-détection du séparateur : ; prioritaire si présent, sinon ,
  const sep = (raw.split(';').length >= raw.split(',').length && raw.indexOf(';')>=0) ? ';' : ',';
  const lines = raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const rows=[];
  for(const ln of lines){
    if(!ln.trim()) continue;
    // gestion basique des guillemets
    const cells=[]; let cur=''; let inQ=false;
    for(let i=0;i<ln.length;i++){
      const c=ln[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===sep && !inQ){ cells.push(cur); cur=''; continue; }
      cur+=c;
    }
    cells.push(cur);
    rows.push(cells.map(x=>x.trim()));
  }
  return {sep,rows};
}
/* Ouvre le modal d'options + mapping + aperçu, puis importe */
function openCsvOptionsModal(raw,preview){
  const {sep,rows}=preview;
  const maxCols = rows.reduce((m,r)=>Math.max(m,r.length),0);
  // Détecte si la 1ère ligne est un header plausible
  const firstCells=rows[0];
  const headerLooksLikeHeader = firstCells.some(c=>/^(nom|pr[eé]nom|sexe|gender|name|classe)$/i.test(c));
  // Suggestions de mapping par header
  const headers = headerLooksLikeHeader ? firstCells : [];
  const suggestCol = (regexes)=>{
    for(let i=0;i<maxCols;i++){
      const h=(headers[i]||'').toLowerCase();
      if(regexes.some(r=>r.test(h))) return i;
    }
    return -1;
  };
  const sugNom = suggestCol([/^nom$/,/^lastname$/,/^surname$/]);
  const sugPrenom = suggestCol([/^pr[eé]nom$/,/^firstname$/,/^givenname$/,/^name$/]);
  const sugSexe = suggestCol([/^sexe$/,/^sex$/,/^genre$/,/^gender$/]);
  // Construit l'aperçu (10 premières lignes)
  const previewHtml = rows.slice(headerLooksLikeHeader?1:0, (headerLooksLikeHeader?1:0)+8)
    .map((r,i)=>`<tr><td>${i+1}</td>${Array.from({length:maxCols},(_,j)=>`<td>${(r[j]||'').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('');
  // Options de mapping (une select par colonne)
  let mapOpts='';
  for(let i=0;i<maxCols;i++){
    const h=headerLooksLikeHeader ? headers[i] : 'Colonne '+(i+1);
    mapOpts+=`<label class="field" style="min-width:120px"><span>${(h||('Colonne '+(i+1))).replace(/</g,'&lt;')}</span>
      <select id="csvMap_${i}">
        <option value="ignore">— Ignorer —</option>
        <option value="nom"${i===sugNom?' selected':''}>Nom</option>
        <option value="prenom"${i===sugPrenom?' selected':''}>Prénom</option>
        <option value="sexe"${i===sugSexe?' selected':''}>Sexe</option>
      </select></label>`;
  }
  const body=`
  <p class="muted">Importez une liste d'élèves dans la classe courante. Les élèves sont ajoutés aux places disponibles. Les données existantes sont conservées.</p>
  <div class="divider"></div>
  <div class="row" style="flex-wrap:wrap;gap:14px;align-items:flex-end">
    <label class="field"><span>Séparateur</span>
      <select id="csvSep"><option value=";"${sep===';'?' selected':''}>Point-virgule ;</option><option value=","${sep===','?' selected':''}>Virgule ,</option></select>
    </label>
    <label class="row center" style="gap:6px;height:38px"><input type="checkbox" id="csvHeader" ${headerLooksLikeHeader?'checked':''}> La 1<sup>ère</sup> ligne est un en-tête</label>
  </div>
  <div class="divider"></div>
  <h3 style="font-size:13px">Correspondance des colonnes</h3>
  <div class="row" style="flex-wrap:wrap;gap:10px">${mapOpts}</div>
  <p class="muted" style="margin-top:6px">Astuce : « Nom » et « Prénom » seront combinés en « NOM Prénom ». Si seul « Nom » est mappé, la cellule entière est utilisée comme nom complet. Le sexe doit contenir M/F (ou Masculin/Féminin/Garçon/Fille).</p>
  <div class="divider"></div>
  <h3 style="font-size:13px">Aperçu (8 premières lignes)</h3>
  <div style="overflow:auto;max-height:200px"><table class="csv-preview"><thead><tr><th>#</th>${Array.from({length:maxCols},(_,j)=>`<th>Col ${(j+1)}</th>`).join('')}</tr></thead><tbody>${previewHtml}</tbody></table></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="primary" id="csvDoImport">Importer</button></div>
  `;
  openModal('📁 Importer un CSV',body,true);
  // Re-parse si on change séparateur / header
  const rePreview=()=>{
    const newSep=document.getElementById('csvSep').value;
    const hasHeader=document.getElementById('csvHeader').checked;
    const r2=parseCsvPreview(raw.indexOf(newSep)>=0 || newSep===sep ? raw : raw.split(sep).join(newSep));
    // reconstruire mapping selects
    const maxC=r2.rows.reduce((m,r)=>Math.max(m,r.length),0);
    // mettre à jour les selects si le nb de colonnes change
    const mapDiv=document.querySelector('#modalRoot .row[style*="flex-wrap:wrap"]');
    let mo='';
    const curMap={};
    document.querySelectorAll('[id^="csvMap_"]').forEach(s=>{ curMap['csvMap_'+s.dataset.ci]=s.value; });
    for(let i=0;i<maxC;i++){
      const h=hasHeader ? r2.rows[0][i] : 'Colonne '+(i+1);
      mo+=`<label class="field" style="min-width:120px"><span>${(h||('Colonne '+(i+1))).replace(/</g,'&lt;')}</span>
        <select id="csvMap_${i}" data-ci="${i}">
          <option value="ignore">— Ignorer —</option>
          <option value="nom">Nom</option>
          <option value="prenom">Prénom</option>
          <option value="sexe">Sexe</option>
        </select></label>`;
    }
    mapDiv.innerHTML=mo;
    // reconstruire l'aperçu
    const start=hasHeader?1:0;
    const ph=r2.rows.slice(start,start+8).map((r,i)=>`<tr><td>${i+1}</td>${Array.from({length:maxC},(_,j)=>`<td>${(r[j]||'').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('');
    const tb=document.querySelector('#modalRoot .csv-preview tbody'); if(tb) tb.innerHTML=ph;
  };
  document.getElementById('csvSep').onchange=rePreview;
  document.getElementById('csvHeader').onchange=rePreview;
  document.getElementById('csvDoImport').onclick=()=>{
    const useSep=document.getElementById('csvSep').value;
    const hasHeader=document.getElementById('csvHeader').checked;
    const r=parseCsvPreview(raw.indexOf(useSep)>=0 || useSep===sep ? raw : raw.split(sep).join(useSep));
    // mapping
    const map={nom:-1,prenom:-1,sexe:-1};
    document.querySelectorAll('[id^="csvMap_"]').forEach(sel=>{
      const idx=parseInt(sel.id.replace('csvMap_',''));
      if(sel.value!=='ignore' && map[sel.value]===-1) map[sel.value]=idx;
    });
    const start=hasHeader?1:0;
    const dataRows=r.rows.slice(start);
    const cls=currentClass();
    let added=0, skipped=0;
    for(const cells of dataRows){
      let name='';
      if(map.nom>=0 && map.prenom>=0){
        const nom=(cells[map.nom]||'').toUpperCase();
        const prenom=cells[map.prenom]||'';
        name=(nom+' '+prenom).trim();
      } else if(map.nom>=0){
        name=(cells[map.nom]||'').trim();
      } else if(map.prenom>=0){
        name=(cells[map.prenom]||'').trim();
      } else {
        // aucune colonne mappée -> utiliser toute la ligne concaténée
        name=cells.filter(Boolean).join(' ').trim();
      }
      if(!name){ skipped++; continue; }
      let sex='';
      if(map.sexe>=0){
        const v=(cells[map.sexe]||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if(/^(M|MASC|MASCU|MASCULIN|GARCON|BOY|H|HOMME)$/.test(v)) sex='M';
        else if(/^(F|FEM|FEMME|FEMIN|FEMININ|FILLE|GIRL)$/.test(v)) sex='F';
      }
      const s={id:uid(),name,sex,seat:findFreeSeat(cls),trackers:{},validated:{},verified:{},needs:[]};
      cls.students.push(s); added++;
    }
    save(); render();
    closeModal();
    toast(added+' élève(s) importé(s)'+(skipped?(', '+skipped+' ligne(s) ignorée(s)'):''));
  };
}

  <h3 style="font-size:13px">3. Brassage</h3>
  <div class="row">
    <label class="row center" style="gap:6px"><input type="checkbox" id="genRandom"> Aléatoire pur (ignore le tri)</label>
  </div>
  <p class="muted" style="margin-top:4px">Si coché, le tri et l'alternance sont ignorés : placement 100% aléatoire.</p>
  <div class="divider"></div>
  <div class="hint-box">📊 ${list.length} élève(s) à placer dans ${nbPl} place(s) disponible(s). M:${nbM} · F:${nbF}${nbU?' · ?:'+nbU:''}</div>
  <div class="row" style="margin-top:10px;justify-content:flex-end">
    <button onclick="closeModal()">Annuler</button>
    <button class="primary" onclick="doGenerate()">🎲 Générer le plan</button>
  </div>`;
  openModal(sg?'🎲 Génération du plan du sous-groupe':'🎲 Génération du plan de classe', body, true);
}

// Extrait le nom de famille = partie en MAJUSCULES, sinon le dernier mot
function sortKey(s){
  const m = s.name.match(/([A-ZÀ-Ý]{2,})/);
  if(m) return m[1];
  const parts = s.name.trim().split(/\s+/);
  return parts[parts.length-1].toUpperCase();
}

function doGenerate(){
  const V=activeView(); const sg=isSubgroupView();
  const alpha=document.getElementById('genAlpha').checked;
  const alphaInv=document.getElementById('genAlphaInv').checked;
  const alternate=document.getElementById('genAlternate').checked;
  const altMode=document.getElementById('genAltMode').value;
  const random=document.getElementById('genRandom').checked;

  // places libres
  const free=[];
  V.layout.desks.forEach(d=>{ if(d.disabled) return; const nb=d.seats||2; for(let si=0;si<nb;si++) if(!d.seatDisabled[si]) free.push({deskId:d.id,index:si}); });

  // liste des membres (objets élève originaux pour classe, refs pour sous-groupe)
  let studs=activeStudents();

  if(random){
    // brassage pur
    for(let i=studs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [studs[i],studs[j]]=[studs[j],studs[i]]; }
    for(let i=free.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [free[i],free[j]]=[free[j],free[i]]; }
  }else{
    // 1. tri alphabétique
    if(alpha){
      studs.sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
      if(alphaInv) studs.reverse();
    }
    // 2. alternance M/F
    if(alternate){
      let males=studs.filter(s=>s.sex==='M');
      let females=studs.filter(s=>s.sex==='F');
      let unknown=studs.filter(s=>!s.sex);
      let first = (altMode==='fFirst') ? 'F' : (altMode==='mFirst' ? 'M' : (females.length>=males.length?'F':'M'));
      const result=[];
      let m=0,f=0;
      while(m<males.length || f<females.length){
        if(first==='F'){ if(f<females.length) result.push(females[f++]); if(m<males.length) result.push(males[m++]); }
        else { if(m<males.length) result.push(males[m++]); if(f<females.length) result.push(females[f++]); }
      }
      studs = result.concat(unknown);
    }
  }

  // assigner aux places
  if(sg){
    V.assignments=[];
    studs.forEach((s,i)=>{ if(i<free.length){ const owner=findStudentClass(s.id); if(owner) V.assignments.push({deskId:free[i].deskId,index:free[i].index,classId:owner.id,studentId:s.id}); } });
  } else {
    studs.forEach((s,i)=>{ s.seat = i<free.length ? free[i] : null; });
  }
  save(); render(); closeModal(); toast('Plan généré ('+free.length+' places remplies sur '+studs.length+' élèves)');
}
window.doGenerate=doGenerate;

function shuffleStudents(){ openGenerateModal(); }
function printPlan(){
  const V=activeView(); const d=new Date();
  const dateStr=d.toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const label = isSubgroupView() ? 'Plan du sous-groupe' : 'Plan de classe';
  document.getElementById('printHeader').innerHTML=`<h2>${label} — ${escapeHtml(V.name)}</h2><div class="sub">Trimestre ${state.activeTrimester} • Édité le ${dateStr}</div>`;
  // quitter le plein écran avant d'imprimer (sinon l'impression se fait dans le contexte plein écran)
  if(isPlanFullscreen()){
    const done=()=>setTimeout(()=>window.print(),300);
    if(document.fullscreenElement){ document.exitFullscreen().then(done).catch(done); }
    else { document.getElementById('tab-plan').classList.remove('fs-fallback'); done(); }
    return;
  }
  window.print();
}

/* ====================================================================
   UTILS
==================================================================== */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

/* ====================================================================
   EVENTS & INIT
==================================================================== */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.style.display=c.id==='tab-'+name?'':'none');
  if(name==='stats') renderStats();
  if(name==='layout') renderLayoutPanel();
  if(name==='students') renderStudentList();
}
function bindEvents(){
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
  document.getElementById('classSelect').addEventListener('change',e=>{ switchActiveView(e.target.value); });
  document.getElementById('planClassSelect').addEventListener('change',e=>{ switchActiveView(e.target.value); });
  document.getElementById('addClassBtn').onclick=addClass;
  document.getElementById('renameClassBtn').onclick=renameClass;
  document.getElementById('delClassBtn').onclick=deleteClass;
  document.getElementById('addStudentBtn').onclick=addStudent;
  document.getElementById('newStudentName').addEventListener('keydown',e=>{ if(e.key==='Enter') addStudent(); });
  document.getElementById('searchInput').addEventListener('input',()=>{ renderStudentList(); highlightSearch(); });
  document.getElementById('exportBtn').onclick=exportData;
  document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change',e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
  document.getElementById('importCsvBtn').onclick=()=>document.getElementById('csvFileInput').click();
  document.getElementById('csvFileInput').addEventListener('change',e=>{ if(e.target.files[0]) importCsv(e.target.files[0]); e.target.value=''; });
  document.getElementById('settingsBtn').onclick=openSettings;
  document.getElementById('saveBtn').onclick=saveNow;
  document.getElementById('shuffleBtn').onclick=shuffleStudents;
  document.getElementById('printBtn').onclick=printPlan;
  document.getElementById('planAddBtn').onclick=planAddStudent;
  document.getElementById('planRemoveBtn').onclick=openRemoveStudentModal;
  document.getElementById('fullscreenBtn').onclick=togglePlanFullscreen;
  document.getElementById('planSettingsBtn').onclick=openSettings;
  // barre des non placés : accepter un dépôt pour libérer un élève de sa place
  const upBar=document.getElementById('unplacedBar');
  upBar.addEventListener('dragover',e=>{ if(dragData){ e.preventDefault(); upBar.classList.add('drop-active'); } });
  upBar.addEventListener('dragleave',()=>upBar.classList.remove('drop-active'));
  upBar.addEventListener('drop',e=>{
    e.preventDefault(); upBar.classList.remove('drop-active');
    if(dragData && dragData.studentId){
      const sid=dragData.studentId;
      if(isSubgroupView()){
        const sgView=activeView();
        sgView.assignments=sgView.assignments.filter(a=>a.studentId!==sid);
        save(); render(); toast('Élève libéré du sous-groupe');
      } else {
        const st=findStudent(sid);
        if(st && st.seat){ st.seat=null; save(); render(); toast('Élève libéré de sa place'); }
      }
    }
  });
  document.getElementById('boardEl').addEventListener('dblclick',()=>{ const V=activeView(); const v=prompt('Libellé du tableau :',V.layout.board.label); if(v!==null){V.layout.board.label=v; save(); render();} });
  document.getElementById('profDeskEl').addEventListener('dblclick',()=>{ const V=activeView(); const v=prompt('Libellé du bureau prof :',V.layout.prof.label); if(v!==null){V.layout.prof.label=v; save(); render();} });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.seat')&&!e.target.closest('.student-card')&&!e.target.closest('.eitem')&&!e.target.closest('.chip')&&!e.target.closest('button')&&!e.target.closest('input')&&!e.target.closest('label')&&!e.target.closest('select')&&!e.target.closest('.fs-student-card')){
      if(!e.target.closest('.sidebar')&&!e.target.closest('.modal')){ state.selectedStudentId=null; render(); }
    }
  });
  window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
  // Raccourci Ctrl/Cmd + S = sauvegarde manuelle
  window.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveNow(); } });
  // Mettre à jour l'indicateur quand une sauvegarde a lieu (autre onglet)
  window.addEventListener('storage',e=>{ if(e.key===STORAGE_KEY){ refreshSaveStatus(); } });
}
load(); bindEvents(); render(); refreshSaveStatus();
</script>
